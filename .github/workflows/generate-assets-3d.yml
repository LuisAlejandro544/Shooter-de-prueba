name: Generate 3D Tactical Assets

# Activación estrictamente manual desde la UI de GitHub Actions (móvil o web)
on:
  workflow_dispatch:
    inputs:
      asset_type:
        description: 'Categoría del asset táctico'
        type: choice
        required: true
        options:
          - 'weapon'
          - 'character'
          - 'environment'
        default: 'weapon'
      asset_prompt:
        description: 'Nombre del modelo o prompt (Ej: "ak-47", "glock", "m4a1", "desert_eagle", "barrett_50", "mp5")'
        type: string
        required: true
        default: 'ak-47'
      include_animations:
        description: 'Incluir esqueletos (rigging) y animaciones de combate horneadas'
        type: boolean
        required: true
        default: true
      generate_audio:
        description: 'Generar archivos de audio balístico (.wav) de disparo y recarga si es arma'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  generate-3d-asset:
    name: Synthesize Asset & Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies for Blender and CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy

      - name: Install Blender CLI (Headless) & System NumPy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          echo "Blender version:"
          blender --version

      - name: Prepare build staging directory
        run: |
          mkdir -p output_staging/models
          mkdir -p output_staging/audio
          mkdir -p output_staging/remote_cache

      - name: Resolve and Query CC0 Public Domain Datasets (Fallback & Kitbashing)
        id: dataset_resolver
        run: |
          python3 tools/blender/fetch_cc0_datasets.py \
            --query "${{ github.event.inputs.asset_prompt }}" \
            --output_info "output_staging/dataset_info.json" \
            --download_to "output_staging/remote_cache/external_mesh.glb"

          cat output_staging/dataset_info.json

      - name: Synthesize 3D Model with Rigging & Animations (100% CC0 / MIT)
        run: |
          ANIM_FLAG=""
          if [ "${{ github.event.inputs.include_animations }}" = "true" ]; then
            ANIM_FLAG="--animated"
          fi

          # Sanitizar nombre de archivo (reemplazar caracteres acentuados, espacios y símbolos)
          CLEAN_NAME=$(echo "${{ github.event.inputs.asset_prompt }}" | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null || echo "${{ github.event.inputs.asset_prompt }}")
          CLEAN_NAME=$(echo "$CLEAN_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd 'a-z0-9_')
          if [ -z "$CLEAN_NAME" ]; then
            CLEAN_NAME="tactical_asset"
          fi

          TARGET_GLB="output_staging/models/${CLEAN_NAME}.glb"

          # Ejecución de Blender pasando las rutas de librerías de Python
          PYTHONPATH="${PYTHONPATH}:$(python3 -c 'import site; print(":".join(site.getsitepackages()))'):/usr/lib/python3/dist-packages" \
          blender -b -P tools/blender/generate_realistic_assets.py -- \
            --type "${{ github.event.inputs.asset_type }}" \
            --model "${{ github.event.inputs.asset_prompt }}" \
            --output "$TARGET_GLB" \
            $ANIM_FLAG

          echo "Verificación del modelo 3D generado:"
          ls -lh "$TARGET_GLB"

      - name: Synthesize Gunfire and Reload Audio (WAV 16-bit 44.1kHz - CC0)
        if: ${{ github.event.inputs.asset_type == 'weapon' && github.event.inputs.generate_audio == 'true' }}
        run: |
          python3 tools/audio/generate_tactical_audio.py \
            --model "${{ github.event.inputs.asset_prompt }}" \
            --output_dir "output_staging/audio"

          echo "Verificación de archivos de audio sintetizados:"
          ls -lh output_staging/audio

      - name: Upload Tactical Asset Package as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tactical-package-${{ github.event.inputs.asset_prompt }}
          path: output_staging/
          if-no-files-found: error
